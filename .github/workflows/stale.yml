name: "Close stale issues and PRs"

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,enhancement,bug,low-priority,documentation,triage"
          exempt-pr-labels: "pinned,enhancement,bug,low-priority,documentation,triage"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          close-issue-message: >
            This issue has been automatically closed because it has not had
            recent activity in 7 days since being marked as stale. Thank you
            for your contributions.
          close-pr-message: >
            This pull request has been automatically closed because it has not had
            recent activity in 7 days since being marked as stale. Thank you
            for your contributions.
